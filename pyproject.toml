[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bookxray-skill"
version = "0.3.0"
description = "Evidence-first book analysis Agent Skill"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
docling = ["docling>=2.0"]
all = ["pymupdf>=1.24", "docling>=2.0"]

[project.scripts]
bookxray = "bookxray.cli:main"

[tool.setuptools.packages.find]
include = ["bookxray*"]
